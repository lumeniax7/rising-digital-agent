name = "rising-digital-agent"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["0 7 * * *", "30 7 * * *", "*/15 * * * *"]   # 07h00 génération, 07h30 rapport (Lomé=UTC), reprises toutes les 15 min

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "rds-agent"
database_id = "f867ed9d-2fe3-477c-bb48-ceb0297ac263"   # base existante — vérifiez cet identifiant dans Cloudflare > D1

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

[vars]
# Variables NON secrètes. Les anciens enregistrements `meta.mode` restent prioritaires sur MODE.
SITE_URL = "https://risingdigitalsolutions.pages.dev"
GRAPH_VERSION = "v23.0"          # à vérifier sur developers.facebook.com/docs/graph-api/changelog avant mise à jour
MODE = "auto"                    # conserve le mode actif en production; .dev.vars.example force test en local
WA_COOLDOWN_H = "0"              # valeur D1 effective actuelle; désactive le délai anti-spam
WA_TEMPLATE_SEND_ENABLED = "false" # garde explicite : aucun modèle ne part tant qu'il n'est pas activé après vérification Meta
WA_ALERT_FAILED_THRESHOLD = "1"  # seuil d'incidents; aucun envoi d'alerte sans report_webhook_url
AI_DAILY_LIMIT = "200"           # garde-fou global d'appels IA / jour (le quota gratuit Workers AI est limité)
ALLOWED_ORIGIN = "https://lumeniax7.github.io"
IMAGE_BASE = "https://rising-digital-agent.yesborntoshine.workers.dev"  # adresse publique des affiches (figée, immune aux visites d'aperçu)  # miroir GitHub Pages autorisé à appeler l'API (CORS)
