name = "rising-digital-agent"
main = "src/index.js"
compatibility_date = "2025-01-01"

[triggers]
crons = ["0 7 * * *", "30 7 * * *"]   # 07h00 UTC = génération/publication (07h00 à Lomé) ; 07h30 UTC = rapport quotidien

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "rds-agent"
database_id = "f867ed9d-2fe3-477c-bb48-ceb0297ac263"   # base existante — vérifiez cet identifiant dans Cloudflare > D1

[assets]
directory = "./public"
binding = "ASSETS"

[observability]
enabled = true

[vars]
# Variables NON secrètes (modifiables aussi depuis le tableau de bord, table `meta`)
SITE_URL = "https://risingdigitalsolutions.pages.dev"
GRAPH_VERSION = "v23.0"          # à vérifier sur developers.facebook.com/docs/graph-api/changelog avant mise à jour
MODE = "test"                    # test = rien n'est publié | approval = validation manuelle | auto = publication automatique
WA_COOLDOWN_H = "6"              # délai anti-spam entre 2 réponses automatiques au même contact (heures)
AI_DAILY_LIMIT = "200"           # garde-fou global d'appels IA / jour (le quota gratuit Workers AI est limité)
ALLOWED_ORIGIN = "https://lumeniax7.github.io"  # miroir GitHub Pages autorisé à appeler l'API (CORS)
