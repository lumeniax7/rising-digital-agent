<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rising Digital Agent</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="login" class="login hidden">
  <form id="login-form">
    <h1>Rising Digital Agent</h1>
    <p class="muted">Rising Digital Solutions — Agbelouvé, Togo</p>
    <label>Identifiant <input name="username" value="admin" autocomplete="username" required></label>
    <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Se connecter</button>
    <p id="login-error" class="error"></p>
  </form>
</div>
<div id="app" class="app hidden">
  <aside>
    <div class="brand"><strong>Rising Digital Agent</strong><span id="mode-badge"></span></div>
    <nav id="nav">
      <a data-view="home" class="active">🏠 Accueil</a>
      <a data-view="calendar">📅 Calendrier</a>
      <a data-view="posts">📰 Publications</a>
      <a data-view="whatsapp">💬 WhatsApp</a>
      <a data-view="crm">🤝 CRM</a>
      <a data-view="media">🖼️ Créations</a>
      <a data-view="memory">🧠 Mémoire</a>
      <a data-view="ai">🤖 Intelligence IA</a>
      <a data-view="reports">📊 Rapports</a>
      <a data-view="events">📝 Journal</a>
      <a data-view="settings">⚙️ Paramètres</a>
    </nav>
    <button id="logout">Déconnexion</button>
  </aside>
  <main id="main"></main>
</div>
<div id="toast"></div>
<script src="/app.js"></script>
</body>
</html>
